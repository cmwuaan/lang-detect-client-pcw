[package]
name = "zlang"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
# Ghim cứng: napi-build 2.2+ khai MSRV 1.88, mà toolchain crate này là 1.77.2.
napi-build = "=2.1.3"
cc = "1"

[profile.release]
lto = false
strip = "symbols"

[profile.dev]
debug = false
incremental = false