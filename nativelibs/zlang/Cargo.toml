[package]
name = "zlang"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# napi bắt buộc cdylib; artifact .dylib được đổi tên thành .node.
crate-type = ["cdylib"]

[dependencies]
# napi4 là mức tối thiểu cho AsyncTask (threadsafe function không cần ở đây).
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
# Ghim cứng: napi-build 2.2+ khai MSRV 1.88, mà toolchain của crate này là 1.77.2
# (rust-toolchain.toml — ràng buộc Windows 7). 2.1.3 là bản cuối còn hợp.
# `unicode-segmentation` cũng phải giữ ở 1.12.0 vì lý do tương tự; nó là dep bắc
# cầu nên chỉ ghim được trong Cargo.lock. Đừng chạy `cargo update` không kèm
# kiểm tra — nó sẽ kéo lại bản mới và build gãy vì MSRV.
napi-build = "=2.1.3"
# Biên dịch bridge Objective-C trên macOS. Không dùng trên Windows.
cc = "1"

[profile.release]
# Module chỉ vài KB; LTO không đáng thời gian link. `strip` bỏ symbol table.
lto = false
strip = "symbols"

[profile.dev]
debug = false
incremental = false
